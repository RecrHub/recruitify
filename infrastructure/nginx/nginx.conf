worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        # Listen on port 80 (HTTP)
        listen 80;
        
        # Accept any domain name or IP address
        server_name _;

        # Increase max body size if you need to upload large files (e.g. CVs/resumes)
        client_max_body_size 50M;

        # 1. Route Java Backend (Spring Boot)
        location /api/ {
            # host.docker.internal works on Mac/Windows Docker Desktop to hit localhost.
            # On Linux/Production, you should use the actual IP or container name.
            proxy_pass http://host.docker.internal:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Route AI Service (Python/FastAPI)
        # Assuming the AI URL is /analyze
        location /analyze {
            proxy_pass http://host.docker.internal:8000/analyze;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Increase timeout for AI processing
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        # 3. Route Frontend (Next.js)
        # Note: If Frontend is also running locally, we route everything else to it.
        location / {
            proxy_pass http://host.docker.internal:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSockets support for Next.js hot-reload (development only)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
