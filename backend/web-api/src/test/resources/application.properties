# Test Configuration
spring.application.name=web-api-test

# H2 Database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable OpenAPI in tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# JWT Properties
jwt.secret=rDjpL6NMo8pDZIHOT6Jfv0+qMDuR6hnuEDq+D9R+/1OHooaf3GMP4iLRW8Z5HhR6tg/rKQhtVM156AHgsD/tRw==
jwt.expirationMs=3600000
jwt.refreshExpirationMs=604800000

# Mail - Mock for tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test

# ImageKit - Dummy values for tests
imagekit.url-endpoint=https://ik.imagekit.io/test
imagekit.private-key=test-private-key
imagekit.public-key=test-public-key
