# SonarQube Configuration
sonar.projectKey=recruitify
sonar.projectName=Recruitify
sonar.projectVersion=1.0
sonar.sources=.
sonar.host.url=http://localhost:9000
sonar.login=your_sonarqube_token

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions - loai bo cac thu muc khong can phan tich
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/.gradle/**,\
  **/build/**,\
  **/target/**,\
  **/coverage/**,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/*.d.ts,\
  **/public/**,\
  **/.idea/**,\
  **/.scannerwork/**

# Coverage reports
sonar.javascript.lcov.reportPaths=apps/frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=apps/backend/web-api/build/reports/jacoco/test/jacocoTestReport.xml
