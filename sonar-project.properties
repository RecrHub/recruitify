# SonarQube Configuration
sonar.projectKey=recruitify
sonar.projectName=Recruitify
sonar.projectVersion=1.0
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# Multi-module setup
sonar.modules=frontend,backend

# Frontend 
frontend.sonar.projectBaseDir=frontend
frontend.sonar.sources=src
frontend.sonar.tests=src
frontend.sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
frontend.sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__test__/**
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Backend 
backend.sonar.projectBaseDir=backend/web-api
backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java
backend.sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*IT.java
backend.sonar.java.binaries=build/classes
backend.sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Global exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/.gradle/**,\
  **/build/**,\
  **/coverage/**,\
  **/public/**

# Quality Gate
sonar.qualitygate.wait=true
