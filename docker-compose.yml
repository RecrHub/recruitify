services:
  postgres-db:
    image: postgres:17-alpine
    container_name: recruitify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: recruitify
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruitify
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitify"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - recruitify-network

  sonarqube:
    image: sonarqube:community
    container_name: recruitify-sonar
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_FORCEAUTHENTICATION: "false"
      SONAR_CE_JAVAOPTS: "-Xmx512m -Xms128m"
      SONAR_WEB_JAVAOPTS: "-Xmx512m -Xms128m"
    deploy:
      resources:
        limits:
          memory: 2g
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ports:
      - "9000:9000"
    networks:
      - recruitify-network

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: recruitify-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - recruitify-network

volumes:
  postgresql-data:
  jenkins_home:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  recruitify-network:
