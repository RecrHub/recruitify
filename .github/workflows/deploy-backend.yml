name: Deploy Backend to Azure VM
# Thanh Hung

on:
  push:
    branches: [develop]
    paths:
      - "backend/web-api/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  build-check:
    name: Build and test (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/web-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

  deploy:
    name: Deploy to VM
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra deploy secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          test -n "$VM_HOST" || { echo "Missing GitHub secret: VM_HOST"; exit 1; }
          test -n "$VM_USER" || { echo "Missing GitHub secret: VM_USER"; exit 1; }
          test -n "$VM_SSH_KEY" || { echo "Missing GitHub secret: VM_SSH_KEY"; exit 1; }

      - name: Đóng gói source backend
        run: |
          tar czf web-api.tgz -C backend \
            --exclude='web-api/build' \
            --exclude='web-api/.gradle' \
            --exclude='web-api/bin' \
            --exclude='web-api/.idea' \
            web-api

      - name: Upload source lên VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: web-api.tgz
          target: /opt/recruitify

      - name: Build lại & khởi động backend trên VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -eu
            cd /opt/recruitify

            # Giải nén vào thư mục mới để file đã xóa trong Git không còn sót lại.
            rm -rf web-api.next
            mkdir web-api.next
            tar xzf web-api.tgz -C web-api.next --strip-components=1
            rm -f web-api.tgz

            rm -rf web-api.previous
            if [ -d web-api ]; then
              mv web-api web-api.previous
            fi
            mv web-api.next web-api

            rollback() {
              echo "Deployment failed; restoring previous source..."
              echo "Container health details:"
              sudo docker inspect --format='{{json .State.Health}}' recruitify-backend || true
              sudo docker compose logs --no-color --tail=100 backend || true
              if [ -d web-api.previous ]; then
                rm -rf web-api
                mv web-api.previous web-api
                sudo docker compose up -d --build backend || true
              fi
              exit 1
            }

            sudo docker compose up -d --build backend || rollback

            # Dockerfile có HEALTHCHECK; chờ tối đa 3 phút trước khi xác nhận deploy.
            healthy=false
            for attempt in $(seq 1 36); do
              status=$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' recruitify-backend 2>/dev/null || true)
              echo "Health check ${attempt}/36: ${status:-not-created}"
              if [ "$status" = "healthy" ]; then
                healthy=true
                break
              fi
              if [ "$status" = "unhealthy" ]; then
                break
              fi
              sleep 5
            done

            [ "$healthy" = "true" ] || rollback
            rm -rf web-api.previous
            sudo docker compose ps
            echo "Backend logs after successful deployment:"
            sudo docker compose logs --no-color --tail=100 backend
