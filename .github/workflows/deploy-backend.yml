name: Deploy Backend to Azure VM

# Tự deploy backend lên VM Azure mỗi khi push thay đổi backend lên nhánh main.
# Yêu cầu đã chạy `terraform apply` trước (VM + docker-compose.yml + .env đã có sẵn trên VM).
#
# GitHub Secrets cần tạo (Settings -> Secrets and variables -> Actions):
#   VM_HOST     : public IP của VM (terraform output vm_public_ip)
#   VM_USER     : azureuser
#   VM_SSH_KEY  : nội dung file infrastructure/terraform/enviroiments/dev/vm_ssh_key.pem

on:
  push:
    branches: [main]
    paths:
      - "backend/web-api/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-check:
    name: Build check (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/web-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build jar (skip tests - Jenkins lo phần test/sonar)
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar --no-daemon -x test

  deploy:
    name: Deploy to VM
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Đóng gói source backend
        run: |
          tar czf web-api.tgz -C backend \
            --exclude='web-api/build' \
            --exclude='web-api/.gradle' \
            --exclude='web-api/bin' \
            --exclude='web-api/.idea' \
            web-api

      - name: Upload source lên VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: web-api.tgz
          target: /opt/recruitify

      - name: Build lại & khởi động backend trên VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/recruitify
            tar xzf web-api.tgz
            rm -f web-api.tgz
            sudo docker compose up -d --build backend
            sudo docker compose ps
